name: Science API tests
on:
  pull_request:
    paths:
      - "api/ai.js"
      - "tests/science-api.test.mjs"
      - "package.json"
      - ".github/workflows/science-tests.yml"
  push:
    branches: [main]
    paths:
      - "api/ai.js"
      - "tests/science-api.test.mjs"
      - "package.json"
      - ".github/workflows/science-tests.yml"
jobs:
  science-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:science
